name: Daily Reservoir Data

on:
  schedule:
    # Run 3x daily: midnight, 8 AM, 4 PM Mountain Time (UTC-7)
    # = 7 AM, 3 PM, 11 PM UTC
    - cron: '0 7,15,23 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_JSON }}
      - name: Generate and upload reservoir data
        env:
          HYDROSHARE_USERNAME: ${{ secrets.HYDROSHARE_USERNAME }}
          HYDROSHARE_PASSWORD: ${{ secrets.HYDROSHARE_PASSWORD }}
        run: |
          # Create env file
          echo "HYDROSHARE_USERNAME=$HYDROSHARE_USERNAME" > .env
          echo "HYDROSHARE_PASSWORD=$HYDROSHARE_PASSWORD" >> .env

          # Run for yesterday (default)
          docker run --env-file .env ghcr.io/cgs-earth/rezviz:latest

          # Clean up
          rm .env
      - name: Trigger Google Cloud load
        run: |
          gcloud run jobs execute ${{ secrets.GCP_JOB_NAME }} --region ${{ secrets.GCP_JOB_REGION }} --wait
      - name: Clear staged backfill rows (only after a successful load)
        env:
          HYDROSHARE_USERNAME: ${{ secrets.HYDROSHARE_USERNAME }}
          HYDROSHARE_PASSWORD: ${{ secrets.HYDROSHARE_PASSWORD }}
        run: |
          # The load step above (--wait) succeeded, so any gap-fill rows the daily
          # run merged into today's CSV (staged by backfill_history.R as
          # pending_backfill.parquet) are now ingested into the database. Delete the
          # staging file so the rows are not re-merged on later runs. This runs ONLY
          # after a successful load, so a failed load leaves the staging file for the
          # next daily run to retry. A 404 (no staging file present) is expected on
          # normal days and ignored.
          curl -sS -u "$HYDROSHARE_USERNAME:$HYDROSHARE_PASSWORD" -X DELETE \
            "https://www.hydroshare.org/hsapi/resource/22b2f10103e5426a837defc00927afbd/files/pending_backfill.parquet/" \
            || echo "No staged backfill file to clear (or delete failed) — continuing."
